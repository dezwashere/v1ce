name: Verify V1CE EAS Update
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, 'Verify V1CE EAS Update pipeline')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --global eas-cli
      - name: Verify Expo auth, publish, and record
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p .eas-verification
          set +e
          {
            echo "=== eas whoami ==="
            eas whoami
            auth_status=$?
            echo "auth_exit_code=$auth_status"
            echo "=== eas update ==="
            if [ "$auth_status" -eq 0 ]; then
              eas update --channel development --message "V1CE baseline OTA verification" --non-interactive
              update_status=$?
            else
              update_status=99
              echo "Update skipped because Expo authentication failed."
            fi
            echo "update_exit_code=$update_status"
          } > .eas-verification/update-result.txt 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .eas-verification/update-result.txt
          git commit -m "Record EAS Update verification result" || true
          git push
          exit 0
