name: Upgrade Expo SDK 57

on:
  push:
    branches: [sdk56-widgets]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sdk56-widgets
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Upgrade Expo SDK
        id: upgrade
        continue-on-error: true
        run: |
          set -o pipefail
          rm -f package-lock.json upgrade-sdk56-error.txt sdk56-verify-error.txt
          npm install expo@^57.0.9 --save --legacy-peer-deps 2>&1 | tee /tmp/upgrade.log
          npx expo install --fix --npm 2>&1 | tee -a /tmp/upgrade.log

      - name: Capture upgrade failure
        if: steps.upgrade.outcome == 'failure'
        run: |
          cp /tmp/upgrade.log upgrade-sdk57-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upgrade-sdk57-error.txt
          git commit -m "capture SDK 57 upgrade error" || true
          git push origin sdk56-widgets || true
          exit 1

      - name: Regenerate native projects
        run: npx expo prebuild --clean --no-install

      - name: Verify
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          npx expo-doctor@latest 2>&1 | tee /tmp/doctor.log

      - name: Capture verification failure
        if: steps.verify.outcome == 'failure'
        run: |
          {
            echo "=== TYPECHECK ==="
            cat /tmp/typecheck.log || true
            echo "=== EXPO DOCTOR ==="
            cat /tmp/doctor.log || true
          } > sdk57-verify-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk57-verify-error.txt
          git commit -m "capture SDK 57 verification error" || true
          git push origin sdk56-widgets || true
          exit 1

      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "upgrade V1CE to Expo SDK 57" || exit 0
          git push origin sdk56-widgets
