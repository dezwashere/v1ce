name: Upgrade Expo SDK 56

on:
  push:
    branches: [sdk56-widgets]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sdk56-widgets
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.3
          cache: npm

      - name: Upgrade Expo SDK
        run: |
          npm install expo@~56.0.21 --save --legacy-peer-deps
          npx expo install --fix

      - name: Regenerate native projects
        run: npx expo prebuild --clean --no-install

      - name: Verify
        run: |
          npm run typecheck
          npx expo-doctor

      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "upgrade V1CE to Expo SDK 56" || exit 0
          git push origin sdk56-widgets
