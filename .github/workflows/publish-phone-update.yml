name: Publish V1CE Phone Update

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: v1ce-development-update
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate app
        run: npm run typecheck
      - name: Ensure Expo credentials are configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN missing; cannot publish V1CE phone update"
            exit 1
          fi
      - name: Publish update to installed development clients
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: npx eas-cli@latest update --channel development --environment development --platform all --message "V1CE ${{ github.sha }}" --non-interactive
