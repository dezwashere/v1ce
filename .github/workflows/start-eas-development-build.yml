name: One-time V1CE development build
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build-ios:
    if: contains(github.event.head_commit.message, 'Start one-time EAS development build')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas build --platform ios --profile development --non-interactive --no-wait
