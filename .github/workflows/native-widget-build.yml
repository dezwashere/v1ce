name: Native Widget Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios-widget:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx expo prebuild -p ios --clean
      - name: Build iOS widget target
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)
          test -n "$WORKSPACE"
          xcodebuild -workspace "$WORKSPACE" -scheme V1CEWidget -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

  android-widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx expo prebuild -p android --clean
      - name: Build Android debug
        working-directory: android
        run: ./gradlew :app:assembleDebug
